spring.application.name=delivery-root-cause
server.port=8080

# Operational "today" inside the dataset (orders run Jan–Sep 2025).
rca.as-of-date=2025-09-12
rca.demo.city-x=New Delhi
rca.demo.city-a=New Delhi
rca.demo.city-b=Ahmedabad
rca.demo.warehouse-b-id=2
rca.demo.client-x-id=409
rca.demo.client-y-id=118
rca.demo.extra-monthly-orders=20000

# Cursor Cloud Agents (billed to your Cursor account). Put the key in an env var, not in git.
# Create a key: https://cursor.com/dashboard → API Keys
rca.ai.enabled=true
rca.ai.provider=cursor
rca.ai.api-key=${CURSOR_API_KEY:}
rca.ai.base-url=https://api.cursor.com
rca.ai.model=composer-2.5
rca.ai.on-startup=false
rca.ai.timeout-seconds=180
